plugins {
    id 'com.android.application'
}

// Public HTTPS address only. Never place tokens or private Actions URLs in the APK.
// Approved binary-only public distribution; source and signing keys remain in this private repo.
def publicChannelRepo = (System.getenv('EDHOME_PUBLIC_CHANNEL_REPO') ?: 'edwinkarolczyk/EDHOME-Updates').trim()
if (publicChannelRepo && !(publicChannelRepo ==~ /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/))
    throw new GradleException('Invalid EDHOME_PUBLIC_CHANNEL_REPO')
def betaFeedUrl = (System.getenv('EDHOME_BETA_FEED_URL')
    ?: (publicChannelRepo
        ? "https://raw.githubusercontent.com/${publicChannelRepo}/main/beta-manifest.json"
        : '')).trim()
if (betaFeedUrl) {
    def feed = new URI(betaFeedUrl)
    if (feed.scheme != 'https' || !feed.host || feed.userInfo || feed.query
            || feed.fragment || !feed.path.endsWith('.json') || feed.path.contains('..')) {
        throw new GradleException('EDHOME_BETA_FEED_URL must be an unauthenticated HTTPS JSON path')
    }
}

android {
    namespace 'com.edwinkarolczyk.edhome'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edwinkarolczyk.edhome'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.2.4'
        buildConfigField 'boolean', 'DIAGNOSTICS_ENABLED', 'false'
        buildConfigField 'String', 'EDHOME_BETA_FEED_URL', groovy.json.JsonOutput.toJson(betaFeedUrl)
    }

    // One durable key, provided through local environment or GitHub Actions secrets.
    // Never create, cache or commit a signing key automatically.
    signingConfigs {
        betaRelease {
            def signingFile = System.getenv('EDHOME_BETA_KEYSTORE_FILE')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('EDHOME_BETA_STORE_PASSWORD')
                keyAlias System.getenv('EDHOME_BETA_KEY_ALIAS')
                keyPassword System.getenv('EDHOME_BETA_KEY_PASSWORD')
            }
        }
    }

    flavorDimensions 'channel'
    productFlavors {
        stable {
            dimension 'channel'
            applicationId 'com.edwinkarolczyk.edhome'
            versionNameSuffix '-prototype'
            manifestPlaceholders = [appLabel: 'EDHOME Prototype']
            buildConfigField 'boolean', 'DIAGNOSTICS_ENABLED', 'false'
        }
        beta {
            dimension 'channel'
            applicationId 'com.edwinkarolczyk.edhome.beta'
            versionNameSuffix '-beta.1'
            signingConfig signingConfigs.betaRelease
            manifestPlaceholders = [appLabel: 'EDHOME Beta']
            buildConfigField 'boolean', 'DIAGNOSTICS_ENABLED', 'true'
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Stable only; beta uses a separate direct-update path with no Play dependency.
    stableImplementation 'com.google.android.play:app-update:2.1.0'
}
