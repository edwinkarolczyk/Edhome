plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edwinkarolczyk.edhome.beta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edwinkarolczyk.edhome.beta'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-beta.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
