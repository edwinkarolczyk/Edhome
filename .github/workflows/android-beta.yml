name: EDHOME Beta APK

on:
  push:
    branches: [beta]
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - ".github/workflows/android-beta.yml"
      - ".github/scripts/**"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: edhome-beta-signing
  cancel-in-progress: false

jobs:
  build-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android platform 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify update-channel scripts
        run: python3 -m py_compile .github/scripts/publish_public_channel.py
      - name: Task calendar recurrence regression
        run: |
          mkdir -p "$RUNNER_TEMP/task-check"
          javac -d "$RUNNER_TEMP/task-check" \
            app/src/main/java/com/edwinkarolczyk/edhome/TaskRules.java \
            tests/task_rules/TaskRulesSmoke.java
          java -cp "$RUNNER_TEMP/task-check" com.edwinkarolczyk.edhome.TaskRulesSmoke
      - name: Time suggestion regression
        run: |
          mkdir -p "$RUNNER_TEMP/time-suggestions"
          javac -d "$RUNNER_TEMP/time-suggestions" \
            app/src/main/java/com/edwinkarolczyk/edhome/TimeSuggestions.java \
            tests/task_rules/TimeSuggestionsSmoke.java
          java -cp "$RUNNER_TEMP/time-suggestions" \
            com.edwinkarolczyk.edhome.TimeSuggestionsSmoke
      - name: Offline shopping rules regression
        run: |
          mkdir -p "$RUNNER_TEMP/shopping"
          javac -d "$RUNNER_TEMP/shopping" \
            app/src/main/java/com/edwinkarolczyk/edhome/ShoppingRules.java \
            tests/task_rules/ShoppingRulesSmoke.java
          java -cp "$RUNNER_TEMP/shopping" \
            com.edwinkarolczyk.edhome.ShoppingRulesSmoke
      - name: Waste task recurrence regression
        run: |
          mkdir -p "$RUNNER_TEMP/waste"
          javac -d "$RUNNER_TEMP/waste" \
            app/src/main/java/com/edwinkarolczyk/edhome/TaskRules.java \
            app/src/main/java/com/edwinkarolczyk/edhome/WasteRules.java \
            tests/task_rules/WasteRulesSmoke.java
          java -cp "$RUNNER_TEMP/waste" \
            com.edwinkarolczyk.edhome.WasteRulesSmoke
      - name: Waste shared-task/notification contract
        run: python3 tests/check_waste_contract.py
      - name: Per-task reminder timing and quiet-hours regression
        run: |
          mkdir -p "$RUNNER_TEMP/reminders"
          javac -d "$RUNNER_TEMP/reminders" \
            app/src/main/java/com/edwinkarolczyk/edhome/QuietHoursRules.java \
            app/src/main/java/com/edwinkarolczyk/edhome/ReminderRules.java \
            tests/task_rules/ReminderRulesSmoke.java
          java -cp "$RUNNER_TEMP/reminders" \
            com.edwinkarolczyk.edhome.ReminderRulesSmoke
      - name: Reminder receiver and backup contract
        run: python3 tests/check_reminder_contract.py
      - name: Hierarchical places regression
        run: |
          mkdir -p "$RUNNER_TEMP/places"
          javac -d "$RUNNER_TEMP/places" \
            app/src/main/java/com/edwinkarolczyk/edhome/PlaceRules.java \
            tests/task_rules/PlaceRulesSmoke.java
          java -cp "$RUNNER_TEMP/places" \
            com.edwinkarolczyk.edhome.PlaceRulesSmoke
      - name: Place hierarchy / task / backup contract
        run: python3 tests/check_place_contract.py
      - name: Appliance timer validation regression
        run: |
          mkdir -p "$RUNNER_TEMP/appliance-timers"
          javac -d "$RUNNER_TEMP/appliance-timers" \
            app/src/main/java/com/edwinkarolczyk/edhome/DeviceTimerRules.java \
            tests/task_rules/DeviceTimerRulesSmoke.java
          java -cp "$RUNNER_TEMP/appliance-timers" \
            com.edwinkarolczyk.edhome.DeviceTimerRulesSmoke
      - name: Appliance timers / alarms / backup contract
        run: python3 tests/check_device_timer_contract.py
      - name: Recurring assignee rotation regression
        run: |
          mkdir -p "$RUNNER_TEMP/rotation"
          javac -d "$RUNNER_TEMP/rotation" \
            app/src/main/java/com/edwinkarolczyk/edhome/RotationRules.java \
            tests/task_rules/RotationRulesSmoke.java
          java -cp "$RUNNER_TEMP/rotation" \
            com.edwinkarolczyk.edhome.RotationRulesSmoke
      - name: Rotation DB / history / backup contract
        run: python3 tests/check_rotation_contract.py
      - name: SQLite migration and backup contract
        run: python3 tests/check_db_contract.py
      - name: Backup schema, nulls and JSON roundtrip contract
        run: python3 tests/check_backup_roundtrip_contract.py
      - name: Beta without PIN contract
        run: python3 tests/check_beta_pin_contract.py
      - name: Nine-tile drop slots and saved order regression
        run: |
          mkdir -p "$RUNNER_TEMP/home-tile-order"
          javac -d "$RUNNER_TEMP/home-tile-order" \
            app/src/main/java/com/edwinkarolczyk/edhome/HomeTileOrder.java \
            tests/task_rules/HomeTileOrderSmoke.java
          java -cp "$RUNNER_TEMP/home-tile-order" \
            com.edwinkarolczyk.edhome.HomeTileOrderSmoke
      - name: Unlimited home tile catalog and legacy migration
        run: |
          mkdir -p "$RUNNER_TEMP/home-tiles-v2"
          javac -d "$RUNNER_TEMP/home-tiles-v2" \
            app/src/main/java/com/edwinkarolczyk/edhome/HomeTileOrder.java \
            app/src/main/java/com/edwinkarolczyk/edhome/HomeTileCatalog.java \
            tests/task_rules/HomeTileCatalogSmoke.java
          java -cp "$RUNNER_TEMP/home-tiles-v2" \
            com.edwinkarolczyk.edhome.HomeTileCatalogSmoke
      - name: Adaptive tile width and hold thresholds
        run: |
          mkdir -p "$RUNNER_TEMP/home-layout"
          javac -d "$RUNNER_TEMP/home-layout" \
            app/src/main/java/com/edwinkarolczyk/edhome/HomeTileLayout.java \
            tests/task_rules/HomeTileLayoutSmoke.java
          java -cp "$RUNNER_TEMP/home-layout" \
            com.edwinkarolczyk.edhome.HomeTileLayoutSmoke
          python3 tests/check_home_adaptive_contract.py
      - name: Four-theme UI-only and drag-edit contract
        run: python3 tests/check_ui_refresh_contract.py
      - name: Pantry barcode check digits
        run: |
          mkdir -p "$RUNNER_TEMP/pantry-scan"
          javac -d "$RUNNER_TEMP/pantry-scan" \
            app/src/main/java/com/edwinkarolczyk/edhome/PantryScanRules.java \
            tests/task_rules/PantryScanRulesSmoke.java
          java -cp "$RUNNER_TEMP/pantry-scan" \
            com.edwinkarolczyk.edhome.PantryScanRulesSmoke
      - name: Pantry Open Food Facts integration contract
        run: python3 tests/check_pantry_off_contract.py
      - name: Pantry category regression
        run: |
          mkdir -p "$RUNNER_TEMP/pantry-categories"
          javac -d "$RUNNER_TEMP/pantry-categories" \
            app/src/main/java/com/edwinkarolczyk/edhome/PantryCategories.java \
            tests/task_rules/PantryCategoriesSmoke.java
          java -cp "$RUNNER_TEMP/pantry-categories" \
            com.edwinkarolczyk.edhome.PantryCategoriesSmoke
      - name: Pantry category and backup contract
        run: python3 tests/check_pantry_categories_contract.py
      - name: Pantry package rules and backup contract
        run: |
          mkdir -p "$RUNNER_TEMP/pantry-packages"
          javac -d "$RUNNER_TEMP/pantry-packages" \
            app/src/main/java/com/edwinkarolczyk/edhome/PantryPackageRules.java \
            tests/task_rules/PantryPackageRulesSmoke.java
          java -cp "$RUNNER_TEMP/pantry-packages" \
            com.edwinkarolczyk.edhome.PantryPackageRulesSmoke
          python3 tests/check_pantry_packages_contract.py
      - name: Batch barcode scan state and integration contract
        run: |
          mkdir -p "$RUNNER_TEMP/pantry-batch"
          javac -d "$RUNNER_TEMP/pantry-batch" \
            app/src/main/java/com/edwinkarolczyk/edhome/PantryBatchSession.java \
            tests/task_rules/PantryBatchSessionSmoke.java
          java -cp "$RUNNER_TEMP/pantry-batch" \
            com.edwinkarolczyk.edhome.PantryBatchSessionSmoke
          python3 tests/check_pantry_batch_contract.py
      - name: Alternate UPC EAN GTIN lookup regression
        run: |
          mkdir -p "$RUNNER_TEMP/pantry-lookup-codes"
          javac -d "$RUNNER_TEMP/pantry-lookup-codes" \
            app/src/main/java/com/edwinkarolczyk/edhome/PantryScanRules.java \
            app/src/main/java/com/edwinkarolczyk/edhome/PantryLookupCodes.java \
            tests/task_rules/PantryLookupCodesSmoke.java
          java -cp "$RUNNER_TEMP/pantry-lookup-codes" \
            com.edwinkarolczyk.edhome.PantryLookupCodesSmoke
          python3 tests/check_pantry_sources_contract.py
      - name: Pantry name search confirmation contract
        run: python3 tests/check_pantry_name_search_contract.py
      - name: Existing pantry product barcode contract
        run: python3 tests/check_pantry_existing_code_contract.py
      - name: Shopping receipt inventory and backup contract
        run: python3 tests/check_shopping_receipt_contract.py
      - name: Purchase price history and SQLite v22
        run: python3 tests/check_pantry_prices_contract.py
      - name: Storage object box QR and backup contract
        run: |
          mkdir -p "$RUNNER_TEMP/edhome-storage-qr"
          javac -d "$RUNNER_TEMP/edhome-storage-qr" \
            app/src/main/java/com/edwinkarolczyk/edhome/StorageQr.java \
            tests/task_rules/StorageQrSmoke.java
          java -cp "$RUNNER_TEMP/edhome-storage-qr" \
            com.edwinkarolczyk.edhome.StorageQrSmoke
          python3 tests/check_storage_qr_contract.py
      - name: Storage location and place deletion regression
        run: python3 tests/check_storage_integrity_contract.py
      - name: PayCheck grosze and shared-only ledger contract
        run: |
          mkdir -p "$RUNNER_TEMP/edhome-paycheck"
          javac -d "$RUNNER_TEMP/edhome-paycheck" \
            app/src/main/java/com/edwinkarolczyk/edhome/MoneyRules.java \
            tests/task_rules/MoneyRulesSmoke.java
          java -cp "$RUNNER_TEMP/edhome-paycheck" \
            com.edwinkarolczyk.edhome.MoneyRulesSmoke
          python3 tests/check_paycheck_contract.py
      - name: PayCheck goals and backup contract
        run: python3 tests/check_paycheck_goals_contract.py
      - name: Private PayCheck crypto and privacy contract
        run: |
          mkdir -p "$RUNNER_TEMP/private-paycheck"
          javac -d "$RUNNER_TEMP/private-paycheck" app/src/main/java/com/edwinkarolczyk/edhome/PrivatePaycheckCrypto.java tests/task_rules/PrivatePaycheckCryptoSmoke.java
          java -cp "$RUNNER_TEMP/private-paycheck" com.edwinkarolczyk.edhome.PrivatePaycheckCryptoSmoke
          python3 tests/check_private_paycheck_contract.py
          python3 tests/check_private_backup_contract.py
      - name: Update installer single-flight and polling regression
        run: python3 tests/check_updater_contract.py
      - name: Compile-check Beta and Stable
        run: gradle --no-daemon :app:compileBetaDebugJavaWithJavac :app:compileStableDebugJavaWithJavac
      - name: Require persistent private signing key
        env:
          BETA_KEY_B64: ${{ secrets.EDHOME_BETA_KEYSTORE_B64 }}
          BETA_KEY_ALIAS: ${{ secrets.EDHOME_BETA_KEY_ALIAS }}
          BETA_STORE_PASSWORD: ${{ secrets.EDHOME_BETA_STORE_PASSWORD }}
          BETA_KEY_PASSWORD: ${{ secrets.EDHOME_BETA_KEY_PASSWORD }}
        run: |
          if [[ -z "$BETA_KEY_B64" || -z "$BETA_KEY_ALIAS" || -z "$BETA_STORE_PASSWORD" || -z "$BETA_KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more EDHOME_BETA signing secrets. No APK is published: random debug signatures would break updates and risk loss of app data."
            exit 1
          fi
          printf '%s' "$BETA_KEY_B64" | base64 --decode > "$RUNNER_TEMP/edhome-beta.p12"
          chmod 600 "$RUNNER_TEMP/edhome-beta.p12"
          EXPECTED_SHA256="40:E8:EF:84:39:F2:67:76:A4:F4:95:E6:B3:95:1C:72:E8:75:9E:D9:0F:A2:6D:9A:47:6A:AC:0A:58:9A:A6:EE"
          ACTUAL_SHA256=$(keytool -list -v -keystore "$RUNNER_TEMP/edhome-beta.p12" -storepass "$BETA_STORE_PASSWORD" -alias "$BETA_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::EDHOME Beta signing certificate mismatch. Refusing to publish an incompatible APK."
            exit 1
          fi
          echo "EDHOME_BETA_KEYSTORE_FILE=$RUNNER_TEMP/edhome-beta.p12" >> "$GITHUB_ENV"
      - name: Assemble consistently signed Beta Release and compile Stable
        env:
          EDHOME_BETA_STORE_PASSWORD: ${{ secrets.EDHOME_BETA_STORE_PASSWORD }}
          EDHOME_BETA_KEY_ALIAS: ${{ secrets.EDHOME_BETA_KEY_ALIAS }}
          EDHOME_BETA_KEY_PASSWORD: ${{ secrets.EDHOME_BETA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleBetaRelease :app:assembleStableDebug
      - name: Verify signed APK certificate
        run: |
          APK="app/build/outputs/apk/beta/release/app-beta-release.apk"
          EXPECTED_SHA256="40:E8:EF:84:39:F2:67:76:A4:F4:95:E6:B3:95:1C:72:E8:75:9E:D9:0F:A2:6D:9A:47:6A:AC:0A:58:9A:A6:EE"
          ACTUAL_SHA256=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}' | sed 's/../&:/g;s/:$//')
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Signed APK has an unexpected certificate."
            exit 1
          fi
      - name: Require AndroidX ContextCompat in signed Beta APK
        run: |
          APK="app/build/outputs/apk/beta/release/app-beta-release.apk"
          mkdir -p "$RUNNER_TEMP/edhome-dex"
          FOUND=0
          for DEX in $(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$'); do
            unzip -p "$APK" "$DEX" > "$RUNNER_TEMP/edhome-dex/$DEX"
            "$ANDROID_HOME/build-tools/35.0.0/dexdump" -f "$RUNNER_TEMP/edhome-dex/$DEX" > "$RUNNER_TEMP/edhome-dex/$DEX.txt"
            if grep -Fq "Landroidx/core/content/ContextCompat;" "$RUNNER_TEMP/edhome-dex/$DEX.txt"; then
              FOUND=1
              break
            fi
          done
          if [[ "$FOUND" -ne 1 ]]; then
            echo "::error::ContextCompat is absent from the Beta APK; camera will crash on Android."
            exit 1
          fi
          echo "AndroidX ContextCompat present in Beta APK"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDHOME-0.5.0-beta.9-signed-apk
          path: app/build/outputs/apk/beta/release/app-beta-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed Beta release and live manifest
        env:
          GH_TOKEN: ${{ github.token }}
          EDHOME_BETA_NOTES: "EDHOME Beta 0.5.0-beta.9 — kopia danych z weryfikacja pliku, przywracanie historii cen i bezpieczna transakcja. SQLite v22 bez migracji."
        run: python3 .github/scripts/publish_public_channel.py
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/edhome-beta.p12"
