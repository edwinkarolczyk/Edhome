            if git rev-parse HEAD^ >/dev/null 2>&1 \
                && git diff --quiet HEAD^ HEAD -- app build.gradle settings.gradle gradle.properties gradle; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Beta $VERSION jest już opublikowana; ten push nie zmienia wejść builda Androida."
            else
              echo "::error::Beta $VERSION jest już opublikowana, ale zmieniły się wejścia builda Androida. Podbij versionCode/versionName."
              exit 1
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Beta $VERSION wymaga publikacji."
          fi
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDHOME-${{ steps.beta_publish.outputs.version }}-signed-apk
          path: app/build/outputs/apk/beta/release/app-beta-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed Beta release and live manifest
        if: steps.beta_publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EDHOME_BETA_NOTES: "EDHOME ${{ steps.beta_publish.outputs.version }} — Beta. Audyt UI Androida: poprawiony kontrast natywnych białych dialogów w Użytkownikach, PayCheck, Magazynie/Skanerze, Zakupach, Spiżarni, Ogrodzie, diagnostyce i QR aktualizacji. Listy Spinner w tych dialogach używają jasnego stylu. Dodano test regresyjny DialogContrast. Main bez zmian."
        run: python3 .github/scripts/publish_public_channel.py
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/edhome-beta.p12"