        run: python3 tests/check_0_6_release_gate.py
      - name: Garden 0.7 catalog CSV regression
        run: |
          mkdir -p "$RUNNER_TEMP/garden-catalog"
          javac -d "$RUNNER_TEMP/garden-catalog" \
            app/src/main/java/com/edwinkarolczyk/edhome/GardenCatalogCsv.java \
            tests/task_rules/GardenCatalogCsvSmoke.java
          java -cp "$RUNNER_TEMP/garden-catalog" \
            com.edwinkarolczyk.edhome.GardenCatalogCsvSmoke
      - name: Garden 0.7 foundation contract
        run: python3 tests/check_garden_contract.py
      - name: Garden 0.7 code-side acceptance gate
        run: python3 tests/check_garden_release_gate.py
      - name: Desktop Wi-Fi read-only sync contract
        run: python3 tests/check_desktop_sync_contract.py
      - name: SUPLA Cloud 0.8 read-only foundation
        run: python3 tests/check_supla_cloud_contract.py
      - name: Compile-check Beta and Stable
        run: gradle --no-daemon :app:compileBetaDebugJavaWithJavac :app:compileStableDebugJavaWithJavac
      - name: Android 5.1 / API 22 compatibility lint
        run: |
          set +e
          gradle --no-daemon :app:lintBetaDebug
          STATUS=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/betaDebug/lintReportBetaDebug/lint-results-betaDebug.txt"
          if [[ -f "$REPORT" ]]; then
            echo "----- FULL API 22 LINT REPORT -----"
            cat "$REPORT"
          fi
          exit "$STATUS"
      - name: Verify actual bundled 100 AI 3D icon images
        run: python3 tests/check_bundled_3d_assets.py
      - name: Require persistent private signing key
        env:
          BETA_KEY_B64: ${{ secrets.EDHOME_BETA_KEYSTORE_B64 }}
          BETA_KEY_ALIAS: ${{ secrets.EDHOME_BETA_KEY_ALIAS }}
          BETA_STORE_PASSWORD: ${{ secrets.EDHOME_BETA_STORE_PASSWORD }}
          BETA_KEY_PASSWORD: ${{ secrets.EDHOME_BETA_KEY_PASSWORD }}
        run: |
          if [[ -z "$BETA_KEY_B64" || -z "$BETA_KEY_ALIAS" || -z "$BETA_STORE_PASSWORD" || -z "$BETA_KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more EDHOME_BETA signing secrets. No APK is published: random debug signatures would break updates and risk loss of app data."
            exit 1
          fi
          printf '%s' "$BETA_KEY_B64" | base64 --decode > "$RUNNER_TEMP/edhome-beta.p12"
          chmod 600 "$RUNNER_TEMP/edhome-beta.p12"
          EXPECTED_SHA256="40:E8:EF:84:39:F2:67:76:A4:F4:95:E6:B3:95:1C:72:E8:75:9E:D9:0F:A2:6D:9A:47:6A:AC:0A:58:9A:A6:EE"
          ACTUAL_SHA256=$(keytool -list -v -keystore "$RUNNER_TEMP/edhome-beta.p12" -storepass "$BETA_STORE_PASSWORD" -alias "$BETA_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::EDHOME Beta signing certificate mismatch. Refusing to publish an incompatible APK."
            exit 1
          fi
          echo "EDHOME_BETA_KEYSTORE_FILE=$RUNNER_TEMP/edhome-beta.p12" >> "$GITHUB_ENV"
      - name: Assemble consistently signed Beta Release and compile Stable
        env:
          EDHOME_BETA_STORE_PASSWORD: ${{ secrets.EDHOME_BETA_STORE_PASSWORD }}
          EDHOME_BETA_KEY_ALIAS: ${{ secrets.EDHOME_BETA_KEY_ALIAS }}
          EDHOME_BETA_KEY_PASSWORD: ${{ secrets.EDHOME_BETA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleBetaRelease :app:assembleStableDebug
      - name: Verify signed APK certificate
        run: |
          APK="app/build/outputs/apk/beta/release/app-beta-release.apk"
          EXPECTED_SHA256="40:E8:EF:84:39:F2:67:76:A4:F4:95:E6:B3:95:1C:72:E8:75:9E:D9:0F:A2:6D:9A:47:6A:AC:0A:58:9A:A6:EE"
          ACTUAL_SHA256=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}' | sed 's/../&:/g;s/:$//')
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Signed APK has an unexpected certificate."
            exit 1
          fi
      - name: Require AndroidX ContextCompat in signed Beta APK
        run: |
          APK="app/build/outputs/apk/beta/release/app-beta-release.apk"
          mkdir -p "$RUNNER_TEMP/edhome-dex"
          FOUND=0
          for DEX in $(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$'); do
            unzip -p "$APK" "$DEX" > "$RUNNER_TEMP/edhome-dex/$DEX"
            "$ANDROID_HOME/build-tools/35.0.0/dexdump" -f "$RUNNER_TEMP/edhome-dex/$DEX" > "$RUNNER_TEMP/edhome-dex/$DEX.txt"
            if grep -Fq "Landroidx/core/content/ContextCompat;" "$RUNNER_TEMP/edhome-dex/$DEX.txt"; then
              FOUND=1
              break
            fi
          done
          if [[ "$FOUND" -ne 1 ]]; then
            echo "::error::ContextCompat is absent from the Beta APK; camera will crash on Android."
            exit 1
          fi
          echo "AndroidX ContextCompat present in Beta APK"
      - name: Resolve Beta publication
        id: beta_publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          gradle=Path("app/build.gradle").read_text(encoding="utf-8")
          name=re.search(r"\bversionName\s+'([^']+)'",gradle).group(1)
          match=re.search(r"beta\s*\{[\s\S]*?versionNameSuffix\s+'([^']*)'",gradle)
          print(name+(match.group(1) if match else ""))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="beta-v$VERSION"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if git rev-parse HEAD^ >/dev/null 2>&1 \
                && git diff --quiet HEAD^ HEAD -- app build.gradle settings.gradle gradle.properties gradle; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Beta $VERSION jest już opublikowana; ten push nie zmienia wejść builda Androida."
            else
              echo "::error::Beta $VERSION jest już opublikowana, ale zmieniły się wejścia builda Androida. Podbij versionCode/versionName."
              exit 1
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Beta $VERSION wymaga publikacji."
          fi
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDHOME-${{ steps.beta_publish.outputs.version }}-signed-apk
          path: app/build/outputs/apk/beta/release/app-beta-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed Beta release and live manifest
        if: steps.beta_publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EDHOME_BETA_NOTES: "EDHOME ${{ steps.beta_publish.outputs.version }} — Beta. P0 PayCheck: oczekujące przelewy można otworzyć także z Budżetu; kolejka z paginacją, jawne ręczne potwierdzenie, wybór konkretnego rachunku i przypisanie potwierdzonego przelewu bez ponownego księgowania. Informacja o niepowodzeniu przypisania bez ukrywania potwierdzenia. Wymaga testu fizycznego; main bez zmian."
        run: python3 .github/scripts/publish_public_channel.py
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/edhome-beta.p12"