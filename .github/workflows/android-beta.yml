name: EDHOME Beta APK

on:
  push:
    branches: [beta]
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - ".github/workflows/android-beta.yml"
  workflow_dispatch:

jobs:
  build-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Assemble beta debug APK
        run: gradle --no-daemon :app:assembleBetaDebug
      - name: Publish installable beta
        uses: actions/upload-artifact@v4
        with:
          name: EDHOME-0.1.0-beta.1-apk
          path: app/build/outputs/apk/beta/debug/app-beta-debug.apk
          if-no-files-found: error
          retention-days: 14
