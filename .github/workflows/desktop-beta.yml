name: EDHOME Desktop Beta

on:
  push:
    branches: [beta]
    paths:
      - "desktop/**"
      - "settings.gradle"
      - "build.gradle"
      - ".github/workflows/desktop-beta.yml"
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile and install distribution
        run: gradle --no-daemon :desktop:clean :desktop:installDist
      - name: Build Windows app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop\build\jpackage | Out-Null
          jpackage --type app-image --name EDHOME-Desktop-Beta --input desktop\build\install\desktop\lib --main-jar desktop.jar --main-class com.edhome.desktop.EdhomeDesktop --dest desktop\build\jpackage --vendor "EDHOME - Idea by Edwin"
          Compress-Archive -Path desktop\build\jpackage\EDHOME-Desktop-Beta\* -DestinationPath desktop\build\EDHOME-Desktop-Beta-Windows.zip -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: EDHOME-Desktop-Beta-Windows
          path: desktop/build/EDHOME-Desktop-Beta-Windows.zip
          if-no-files-found: error
          retention-days: 14
