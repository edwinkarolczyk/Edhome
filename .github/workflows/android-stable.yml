          python3 tests/check_bank_evidence_queue_contract.py
      - name: PayCheck provenance and backup regression
        run: python3 tests/check_paycheck_provenance_contract.py
      - name: SQLite migration and backup contract
        run: python3 tests/check_db_contract.py
      - name: User profiles, local PIN and sync contract
