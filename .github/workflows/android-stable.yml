          java -cp "$RUNNER_TEMP/bank-csv" \
            com.edwinkarolczyk.edhome.BankStatementCsvSmoke
          java -cp "$RUNNER_TEMP/bank-csv" \
            com.edwinkarolczyk.edhome.BankStatementMbankSmoke
          java -cp "$RUNNER_TEMP/bank-csv" \
            com.edwinkarolczyk.edhome.BankStatementVeloPdfSmoke
