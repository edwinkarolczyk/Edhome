          python3 tests/check_pantry_multipack_deposit_contract.py
      - name: Scanner failure recovery and duplicate suppression
        run: python3 tests/check_scanner_recovery_contract.py
      - name: Local UPC/EAN TAKE matching, idempotent stock and repeat consent
        run: python3 tests/check_pantry_take_alias_contract.py
      - name: 0.5 TAKE scanner stabilization A-B-A safety
        run: python3 tests/check_pantry_stabilization_contract.py
      - name: Continuous TAKE countdown and interruption regression
        run: |
          mkdir -p "$RUNNER_TEMP/pantry-take"
          javac -d "$RUNNER_TEMP/pantry-take" \
