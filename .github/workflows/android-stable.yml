      - name: Pantry name search confirmation contract
        run: python3 tests/check_pantry_name_search_contract.py
      - name: Existing pantry product barcode contract
        run: python3 tests/check_pantry_existing_code_contract.py
      - name: Shopping destination and unit-total regression
