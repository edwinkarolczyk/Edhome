        run: python3 tests/check_desktop_sync_contract.py
      - name: SUPLA Cloud 0.8 read-only foundation
        run: python3 tests/check_supla_cloud_contract.py
      - name: Compile-check Beta and Stable
        run: gradle --no-daemon :app:compileBetaDebugJavaWithJavac :app:compileStableDebugJavaWithJavac
      - name: Verify actual bundled 100 AI 3D icon images
        run: python3 tests/check_bundled_3d_assets.py
      - name: Require persistent EDHOME signing key
        env:
          KEY_B64: ${{ secrets.EDHOME_BETA_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.EDHOME_BETA_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.EDHOME_BETA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.EDHOME_BETA_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEY_B64" || -z "$KEY_ALIAS" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing EDHOME signing secrets; refusing Stable release."
            exit 1
          fi
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/edhome-stable.p12"
          chmod 600 "$RUNNER_TEMP/edhome-stable.p12"
          EXPECTED_SHA256="40:E8:EF:84:39:F2:67:76:A4:F4:95:E6:B3:95:1C:72:E8:75:9E:D9:0F:A2:6D:9A:47:6A:AC:0A:58:9A:A6:EE"
          ACTUAL_SHA256=$(keytool -list -v -keystore "$RUNNER_TEMP/edhome-stable.p12" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')
          [[ "$ACTUAL_SHA256" == "$EXPECTED_SHA256" ]] || { echo "::error::EDHOME signing certificate mismatch."; exit 1; }
          echo "EDHOME_BETA_KEYSTORE_FILE=$RUNNER_TEMP/edhome-stable.p12" >> "$GITHUB_ENV"
      - name: Stable identity and promoted feature contract
        run: |
          grep -Fq "versionCode 206" app/build.gradle
          grep -Fq "versionName '0.8.0.14'" app/build.gradle
          grep -Fq "manifestPlaceholders = [appLabel: 'EDHOME']" app/build.gradle
          grep -Fq "signingConfig signingConfigs.betaRelease" app/build.gradle
          grep -Fq "stableImplementation 'com.tom-roush:pdfbox-android:2.0.27.0'" app/build.gradle
          grep -Fq 'android:name=".LanSyncService"' app/src/stable/AndroidManifest.xml
          grep -Fq 'android:name=".BankNotificationListener"' app/src/stable/AndroidManifest.xml
          grep -Fq 'android:name="com.edwinkarolczyk.edhome.StorageQrPdfProvider"' app/src/stable/AndroidManifest.xml
          grep -Fq 'android.permission.INTERNET' app/src/stable/AndroidManifest.xml
          ! grep -Fq 'UpdateApkProvider' app/src/stable/AndroidManifest.xml
          ! grep -Fq 'REQUEST_INSTALL_PACKAGES' app/src/stable/AndroidManifest.xml
          ! grep -Fq 'PROTOTYP' app/src/main/java/com/edwinkarolczyk/edhome/MainActivity.java
      - name: Build signed Stable 0.8.0.14
        env:
          EDHOME_BETA_STORE_PASSWORD: ${{ secrets.EDHOME_BETA_STORE_PASSWORD }}
          EDHOME_BETA_KEY_ALIAS: ${{ secrets.EDHOME_BETA_KEY_ALIAS }}
          EDHOME_BETA_KEY_PASSWORD: ${{ secrets.EDHOME_BETA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleStableRelease
      - name: Verify Stable APK identity and certificate
        run: |
          APK="app/build/outputs/apk/stable/release/app-stable-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package: name='com.edwinkarolczyk.edhome' versionCode='206' versionName='0.8.0.14'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "application-label:'EDHOME'"
          EXPECTED_SHA256="40:E8:EF:84:39:F2:67:76:A4:F4:95:E6:B3:95:1C:72:E8:75:9E:D9:0F:A2:6D:9A:47:6A:AC:0A:58:9A:A6:EE"
          ACTUAL_SHA256=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}' | sed 's/../&:/g;s/:$//')
          [[ "$ACTUAL_SHA256" == "$EXPECTED_SHA256" ]] || { echo "::error::Stable APK has an unexpected certificate."; exit 1; }
      - name: Upload signed Stable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDHOME-0.8.0.14-Stable-signed-APK
          path: app/build/outputs/apk/stable/release/app-stable-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/edhome-stable.p12"
